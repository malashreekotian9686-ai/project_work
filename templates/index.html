<!DOCTYPE html>
<html>
<head>
    <title>Age Calculator</title>
</head>

<body>

    <h2>Age Calculator</h2>

    <form method="POST">

        <label>Enter Date of Birth:</label>

        <input type="date" name="dob" required>

        <button type="submit">Calculate Age</button>

    </form>

    {% if age is not none %}
        <h3>Your Age is {{ age }} years</h3>
    {% endif %}

</body>
</html>
